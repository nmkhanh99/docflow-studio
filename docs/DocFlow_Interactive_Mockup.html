const params=new URLSearchParams(location.search);
const state={view:params.get('view')||'workspace',qty:BASE_QTY,price:BASE_PRICE,rate:BASE_RATE,selectedSection:2,singleSection:2,mode:'affected',ruleV:3,rev:{qty:0,price:0,rate:0,rule:0},changes:[],approved1:true,requests:[{id:'CR-001',description:'Điều chỉnh sản lượng kế hoạch từ 12.000 sản phẩm',section:1}],
 ruleText:'Lấy sản lượng kế hoạch từ Phần 01; tra đơn giá trong Excel 1 theo mã sản phẩm và thời điểm hiệu lực của kế hoạch. Nếu có nhiều dòng hợp lệ, chọn ngày hiệu lực mới nhất; nếu hòa hoặc thiếu dữ liệu thì báo người dùng. Tính doanh thu, cập nhật bảng và viết lại nhận xét của Phần 02.',

 results:{2:{ver:0,basedOn:{qty:0,price:0,rule:0},qty:BASE_QTY,price:BASE_PRICE,ruleV:3,revenue:BASE_QTY*BASE_PRICE,approved:true},3:{ver:0,basedOn:{rate:0,up2:0},revenue:BASE_QTY*BASE_PRICE,rate:BASE_RATE,cost:rd(BASE_QTY*BASE_PRICE*BASE_RATE),approved:true},4:{ver:0,basedOn:{up2:0,up3:0},revenue:BASE_QTY*BASE_PRICE,cost:rd(BASE_QTY*BASE_PRICE*BASE_RATE),profit:rd(BASE_QTY*BASE_PRICE*(1-BASE_RATE)),approved:true},5:{ver:0,basedOn:{up4:0},profit:rd(BASE_QTY*BASE_PRICE*(1-BASE_RATE)),text:'Kết quả kinh doanh phản ánh mức sản lượng 12.000 sản phẩm.',approved:true}}};

/* Q2: stale theo sự kiện thay đổi (bộ đếm rev), không so sánh theo giá trị. Chỉ Run mới ghi lại basedOn. */
function stale(){const r=state.results,v=state.rev;const s2=INPUTS[2].some(k=>r[2].basedOn[k]!==v[k]);const s3=s2||r[3].basedOn.rate!==v.rate||r[3].basedOn.up2!==r[2].ver;const s4=s3||r[4].basedOn.up2!==r[2].ver||r[4].basedOn.up3!==r[3].ver;const s5=s4||r[5].basedOn.up4!==r[4].ver;return {2:s2,3:s3,4:s4,5:s5}}

function isPending(i){return i===1?!state.approved1:!stale()[i]&&!state.results[i].approved}
function pending(){return [1,2,3,4,5].filter(isPending)}
function staleInfo(i){const r=state.results,b=r[i].basedOn,parts=[];let sameVal=false;
 for(const k of (INPUTS[i]||[])){if(b[k]===state.rev[k])continue;const ev=state.changes.filter(e=>e.key===k&&e.rev>b[k]);if(ev.length)parts.push(KEYLABEL[k]+' đã thay đổi ('+[ev[0].from,...ev.map(e=>e.to)].join(' → ')+')')}
 if(i===2&&parts.length&&r[2].qty===state.qty&&r[2].price===state.price&&r[2].ruleV===state.ruleV)sameVal=true;
 if(i===3&&parts.length&&r[3].rate===state.rate)sameVal=true;
 for(const d of (DEPS[i]||[])){if(stale()[d])parts.push('Phần 0'+d+' cần tính lại');else if(b['up'+d]!==r[d].ver)parts.push('Phần 0'+d+' đã được tính lại sau lần tính này')}

t></div></div><div style="margin-top:16px"><label class="label">Yêu cầu nghiệp vụ bằng ngôn ngữ tự nhiên</label><textarea class="textarea" id="rule-instruction" style="min-height:125px" onchange="app.updateRuleText(this.value)">${esc(state.ruleText)}</textarea></div><div class="buttons" style="margin:12px 0"><span class="pill blue">● Định nghĩa đã lưu</span><span class="pill gray">Type: Data + Content Rule</span><span class="pill amber">AI plan: Demo</span></div>${state.ruleSaveMessage?`<div class="notice warn">${esc(state.ruleSaveMessage)}</div>`:''}<div class="divider"></div><div class="card-title" style="margin-bottom:12px">Các bước AI đề xuất thực hiện</div>${recipeSteps()}<div class="notice warn">Trong sản phẩm thật, mô tả mới phải được biên dịch thành execution plan an toàn, kiểm thử và phê duyệt. Demo chỉ lưu mô tả và tính theo công thức giả lập.</div></div></div></div><div class="stack grid-right"><div class="card"><div class="card-head"><h3 class="card-title">▧ Đầu vào / Data Binding</h3></div><div class="card-pad stack"><div class="source"><span class="source-ico word">W</span><div class="details"><b>section-01.quantity</b><small>Phần 01 • ${VN.format(state.qty)} sản phẩm</small></div></div><div class="source"><span class="source-ico">X</span><div class="details"><b>Excel 1 · Bảng giá</b><small>Tra theo mã, ngày hiệu lực</small></div></div><div class="notice">Đơn giá demo hiện tại: ${money(state.price)}. Bản chạy thật cần lưu sheet/range/dòng nguồn được chọn.</div></div></div><div class="card"><div class="card-head"><h3 class="card-title">◇ Định nghĩa dạng máy đọc</h3></div><div class="card-pad"><div class="rule-json">${esc(JSON.stringify(schema,null,2))}</div><div class="screen-note" style="margin-top:12px">JSON hiển thị là schema demo, không phải mã executor được sinh/kiểm thử.</div></div></div></div></div>`}
function graph(){return `<div class="flow-graph"><div class="flow-node green"><b>01. Sản lượng</b><small>${VN.format(state.qty)} sp</small></div><span class="flow-arrow">→</span><div class="flow-node ${stale()[2]?'amber':''}"><b>02. Doanh thu</b><small>${stale()[2]?'Cần tính lại':billion(state.results[2].revenue)}</small></div><span class="flow-arrow">→</span><div class="flow-node ${stale()[3]?'amber':''}"><b>03. Chi phí</b><small>${stale()[3]?'Cần tính lại':billion(state.results[3].cost)}</small></div><span class="flow-arrow">→</span><div class="flow-node ${stale()[4]?'amber':''}"><b>04. Lợi nhuận</b><small>${stale()[4]?'Cần tính lại':billion(state.results[4].profit)}</small></div><span class="flow-arrow">→</span><div class="flow-node ${stale()[5]?'amber':''}"><b>05. Kết luận</b><small>${stale()[5]?'Cần viết lại':'Kết quả hợp lệ'}</small></div></div><div class="tiny muted" style="margin-top:9px">Các nguồn bổ sung: Excel 1 → Phần 02; Excel 2 → Phần 03. Phần 04 còn phụ thuộc trực tiếp vào Phần 02.</div>`}
function resultRows(){return [1,2,3,4,5].map(i=>{const r=state.results[i],value=i===1?VN.format(state.qty)+' sản phẩm':i===2?billion(r.revenue):i===3?billion(r.cost):i===4?billion(r.profit):'Nhận xét từ '+billion(r.profit),why=staleReason(i);return `<tr><td><b>${String(i).padStart(2,'0')}. ${secNames[i]}</b><small>${i===1?'Đầu vào gốc, nhập tại Phần 01':i===2?'Sản lượng × đơn giá':i===3?'Doanh thu × tỷ lệ':i===4?'Doanh thu − Chi phí':'AI tạo đề xuất nội dung'}</small></td><td><b>${value}</b><small>${i===1?'Nguồn: người dùng':i===2?'Nguồn: Phần 01 + Excel 1':i===3?'Nguồn: Phần 02 + Excel 2':'Lưu trong Section Revision'}</small></td><td>${sectionStatus(i)}${why?`<small class="stale-why">${esc(why)}</small>`:''}</td><td><button class="btn small" onclick="app.approveSection(${i})" ${isPending(i)?'':'disabled'} aria-label="Duyệt Phần 0${i}">✓ Duyệt</button></td></tr>`}).join('')}

④ Phạm vi chạy</h3></div><div class="card-pad">${[['single','Chỉ tính lại Phần 02','Kết quả Phần 03–05 giữ nguyên nhưng có thể stale.'],['affected','Tính lại phần bị ảnh hưởng','Phần 02 → 03 → 04 → 05; dùng cache khi phù hợp.'],['full','Chạy lại toàn bộ Recipe','Thực thi tất cả Rule, tạo Run Snapshot mới.']].map(([key,title,desc])=>`<label class="radio-option ${state.mode===key?'active':''}"><input type="radio" name="mode" ${state.mode===key?'checked':''} onchange="app.setMode('${key}')"><div><b>${title}</b><span>${desc}</span></div></label>`).join('')}${state.mode==='single'?`<div style="margin-bottom:10px"><label class="label">Chọn phần cần tính lại</label><select class="select" onchange="app.setSingleSection(this.value)">${[2,3,4,5].map(i=>`<option value="${i}" ${state.singleSection===i?'selected':''}>0${i}. ${secNames[i]}</option>`).join('')}</select></div>`:''}<button class="btn primary wide" onclick="app.run()">▶ Bắt đầu chạy</button><div class="screen-note" style="margin-top:11px">Bản HTML thực hiện phép nhân minh họa bằng JavaScript, không diễn giải/thi hành quy tắc mới từ lời mô tả.</div></div></div><div class="card"><div class="card-head"><h3 class="card-title">◷ Nhật ký chạy</h3></div><div class="card-pad">${state.runs.length?state.runs.slice(0,4).map(r=>`<div class="statusline"><div><b>Run #${r.id} · ${r.time}</b><br><small>Chế độ: ${r.scope}; thực thi: ${r.executed.join(', ')||'Không có'}</small></div>${pill('Đã chạy','green')}</div>`).join(''):'<div class="empty">Chưa có lần chạy trong phiên demo này.</div>'}</div></div></div></div>`}

longContent?'<p>Đoạn phân tích bổ sung được chèn ở phần 1 của tài liệu và dẫn tới thay đổi số trang. Chuyển trang là biến động layout, không tự động là thay đổi văn bản.</p>':''}<div class="doc-bottom">Preview giả lập · Phân trang không được tính từ engine Word</div></div></div></div><div class="card-pad" style="padding-top:10px"><div class="screen-note">Màn hình demo mô phỏng bản build, không áp Patch vào DOCX thật. Trong sản phẩm, preview phải render từ chính bản DOCX đầu ra.</div></div>`}</div><div class="stack grid-right"><div class="card"><div class="card-head"><h3 class="card-title">✓ Kiểm tra build & layout</h3>${pill(state.built?'Demo đã build':'Chưa build',state.built?'green':'amber')}</div><div class="card-pad"><div class="metric-row"><div class="metric"><small>Mẫu V0</small><b>12</b></div><div class="metric"><small>Demo hiện tại</small><b>${state.built?state.built.pages:'—'}</b></div><div class="metric"><small>Biến động</small><b>${state.built?(state.built.pages-12>=0?'+':'')+(state.built.pages-12):'—'}</b></div></div><div class="divider"></div><div class="review-tile"><b>① Content Diff</b><p>Thay sản lượng, kết quả tính và nhận xét theo Section Revision được chọn.</p></div><div class="review-tile"><b>② Layout Diff</b><p>${state.longContent?'Nội dung phần 1 dài thêm; các phần phía sau có thể dịch trang.':'Giả lập chưa có phần nội dung kéo dài.'}</p></div><div class="review-tile"><b>③ Validation thật cần có</b><p>Bảng tràn, hàng bị tách, trang trắng, headings, mục lục, header/footer, số trang, font.</p></div><label style="display:flex;gap:8px;align-items:center;font-size:11px;color:#6c7a94"><input type="checkbox" ${state.longContent?'checked':''} onchange="app.toggleLong()" style="accent-color:#5550db"> Mô phỏng phần 1 dài thêm</label><div class="divider"></div><button class="btn primary wide" onclick="app.createBuild()" ${!available?'disabled':''}>◉ Tạo lại preview giả lập</button><button class="btn wide" style="margin-top:8px" onclick="app.exportManifest()" ${!state.built?'disabled':''}>↓ Tải Build Manifest demo (.json)</button></div></div><div class="card"><div class="card-head"><h3 class="card-title">◷ Build History</h3></div><div class="card-pad">${state.builds.slice(0,4).map(b=>`<div class="statusline"><div><b>${b.id} · ${esc(b.name)}</b><br><small>${b.time} · ${b.pages} trang (minh họa)</small></div>${buildPill(b)}</div>`).join('')}</div></div></div></div>`}
const SIM_NOTE='<div class="sim-banner"><b>Mô phỏng</b> — số trang là hằng số 12/13, không phải phân trang hay diff thật, không phải Word thật. Prototype không tạo file DOCX.</div>';
function contentDiff(){const r=state.results,V0=BASE_QTY*BASE_PRICE;const rows=[['Sản lượng (sản phẩm)',VN.format(BASE_QTY),VN.format(r[2].qty),BASE_QTY!==r[2].qty],['Đơn giá (đ)',VN.format(BASE_PRICE),VN.format(r[2].price),BASE_PRICE!==r[2].price],['Doanh thu (đ)',VN.format(V0),VN.format(r[2].revenue),V0!==r[2].revenue],['Chi phí (đ)',VN.format(rd(V0*BASE_RATE)),VN.format(r[3].cost),rd(V0*BASE_RATE)!==r[3].cost],['Lợi nhuận (đ)',VN.format(rd(V0*(1-BASE_RATE))),VN.format(r[4].profit),rd(V0*(1-BASE_RATE))!==r[4].profit],['Nhận xét Phần 05','Kết quả kinh doanh phản ánh mức sản lượng 12.000 sản phẩm.',r[5].text,r[5].text!=='Kết quả kinh doanh phản ánh mức sản lượng 12.000 sản phẩm.']];return `<div role="tabpanel" aria-label="Content Diff">${SIM_NOTE}<div class="diff-panel"><p class="small muted">Khác biệt nội dung giữa Mẫu gốc V0 và kết quả đang lưu (theo Section Revision). Dữ liệu lấy từ trạng thái demo hiện có.</p><div style="overflow-x:auto"><table class="diff-table"><thead><tr><th>Chỉ tiêu</th><th>Mẫu V0</th><th>Kết quả lưu</th><th>Thay đổi</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td class="${x[3]?'chg':''}">${x[3]?'Đã đổi':'Giữ nguyên'}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function layoutDiff(fp){const pages=fp.pages,d=pages-12;return `<div role="tabpanel" aria-label="Layout Diff">${SIM_NOTE}<div class="diff-panel"><p class="small muted">Khác biệt bố cục (số trang) — tách biệt với thay đổi nội dung.${state.built?'':' Chưa có preview build; hiển thị giá trị dự kiến theo tùy chọn nội dung dài.'}</p><div class="metric-row"><div class="metric"><small>Mẫu V0</small><b>12 trang</b></div><div class="metric"><small>Demo ${state.built?'hiện tại':'dự kiến'}</small><b>${pages} trang</b></div><div class="metric"><small>Biến động</small><b>${d>=0?'+':''}${d}</b></div></div><div class="review-tile" style="margin-top:12px"><b>Trang bị đẩy</b><p>${state.longContent?'Phần 01 dài thêm nên Phần 02 trở đi có thể bị đẩy sang trang kế (mô phỏng, không đo từ engine Word).':'Không có trang bị đẩy trong giả lập.'}</p></div></div></div>`}
function historyView(){return `<div class="headline"><div><h1>History & Version Snapshots</h1><p class="subtitle">Lưu từng lần thay đổi dữ liệu, version Rule, các lần chạy, phê duyệt Section và Manifest dựng tài liệu.</p></div><div class="actions"><button class="btn primary" onclick="app.go('workspace')">↗ Mở Workspace</button></div></div><div class="grid history-grid"><div class="card"><div class="card-head"><h3 class="card-title">◷ Lịch sử trong phiên demo</h3>${pill('Audit timeline','blue')}</div><div class="card-pad"><div class="list-timeline">${(state.runs.length?state.runs.map(r=>`<div class="event"><b>Run #${r.id} · ${r.scope}</b><p>Chạy các phần ${r.executed.join(', ')||'không có'} · ${r.time} · Sản lượng ${VN.format(r.qty)}</p></div>`).join(''):'<div class="event"><b>Chưa có Run mới</b><p>Chọn Dependencies & Run để chạy thử các quy tắc.</p></div>')}${state.requests.map(r=>`<div class="event"><b>${r.id} · Change Request</b><p>${esc(r.description)}</p></div>`).join('')}<div class="event"><b>Thay đổi số liệu — Phần 01</b><p>Sản lượng hiện tại: ${VN.format(state.qty)} sản phẩm, giá trị gốc 12.000.</p></div><div class="event"><b>Recipe đã lưu · v${state.ruleV}</b><p>Đơn giá Excel 1, tỷ lệ chi phí Excel 2, quy tắc doanh thu–lợi nhuận–kết luận.</p></div><div class="event"><b>Template V0 (bất biến)</b><p>DOCX mẫu không thay đổi trong tất cả các bản build.</p></div></div></div></div><div class="stack"><div class="card"><div class="card-head"><h3 class="card-title">▤ Build Snapshots</h3></div><div class="card-pad">${state.builds.map(b=>`<div class="review-tile"><div class="flex-row" style="justify-content:space-between"><b>${b.id}</b>${buildPill(b)}</div><p>${esc(b.name)}<br>${b.pages} trang demo · ${b.time}</p></div>`).join('')}</div></div><div class="card"><div class="card-head"><h3 class="card-title">ⓘ Phạm vi ghi nhận trong sản phẩm thật</h3></div><div class="card-pad"><div class="screen-row"><label>Template</label><div><span class="codeish">sha256:...</span> immutable</div><label>Sources</label><div>Excel 1 v2, Excel 2 v1, reference files</div><label>Recipe</label><div>Rule versions, data bindings, dependency graph</div><label>Run</label><div>Input fingerprints, output, evidence, errors</div><label>Build</label><div>Approved Section Revisions, rendered preview, output hashes</div></div></div></div></div></div>`}
const FOCUSABLE='button,input,select,textarea';
let tabIntent=null;
/* TC-75: change của ô số bắn trong lúc trình duyệt đang dời focus; render() thay innerHTML nên đích Tab bị gỡ -> focus rơi về BODY.
   Sửa gốc: tự commit + preventDefault + render + focus thẳng phần tử kế theo thứ tự Tab. */
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Tab'||e.altKey||e.ctrlKey||e.metaKey||!t||t.tagName!=='INPUT'||t.type!=='number')return;const root=document.getElementById('app');if(!root||!root.contains(t))return;const dir=e.shiftKey?-1:1,i=[...root.querySelectorAll(FOCUSABLE)].indexOf(t);if(i<0)return;const next=()=>{const l=[...root.querySelectorAll(FOCUSABLE)];let j=i+dir;while(j>=0&&j<l.length&&(l[j].disabled||l[j].tabIndex<0))j+=dir;return l[j]||null};const probe=next();if(!probe)return;e.preventDefault();e.stopPropagation();tabIntent=null;if(t.value!==t.defaultValue)t.dispatchEvent(new Event('change',{bubbles:true}));const el=next();if(el){el.focus({preventScroll:true});if(el.select&&el.type==='number')try{el.select()}catch(_){}}},true);
document.addEventListener('keydown',e=>{if(e.key==='Tab'){tabIntent={dir:e.shiftKey?-1:1};setTimeout(()=>{tabIntent=null},60)}},true);
function focusSnap(){const root=document.getElementById('app'),a=document.activeElement;if(!root||!a||!root.contains(a))return null;const list=[...root.querySelectorAll(FOCUSABLE)],i=list.indexOf(a);const cards=[...root.querySelectorAll('.card')],c=a.closest('.card');let sel=null;try{if(a.selectionStart!=null)sel=[a.selectionStart,a.selectionEnd]}catch(_){}return{i,tag:a.tagName,type:a.type||'',card:c?cards.indexOf(c):-1,sel,scroll:window.scrollY,intent:tabIntent}}
function focusRestore(f){if(!f)return;const root=document.getElementById('app'),list=[...root.querySelectorAll(FOCUSABLE)];let el=null;if(f.intent&&f.i>=0){let j=f.i+f.intent.dir;while(j>=0&&j<list.length&&list[j].disabled)j+=f.intent.dir;el=list[j]||null}else if(f.i>=0){const c=list[f.i];if(c&&c.tagName===f.tag&&(c.type||'')===f.type)el=c}
 if(el&&el.disabled)el=null;if(!el&&f.card>=0){el=root.querySelectorAll('.card')[f.card]||null;if(el)el.setAttribute('tabindex','-1')}
 if(!el)return;if(f.intent){const t=el;setTimeout(()=>{if(t.isConnected)t.focus({preventScroll:true});window.scrollTo(0,f.scroll)},0);return}el.focus({preventScroll:true});if(!f.intent&&f.sel&&el.setSelectionRange){try{el.setSelectionRange(f.sel[0],f.sel[1])}catch(_){}}window.scrollTo(0,f.scroll)}
function render(){const snap=focusSnap();const labels={workspace:'Workspace',recipe:'Rule Studio',runner:'Dependency Runner',build:'Build & Preview',history:'History & Versions'};document.getElementById('app').innerHTML=`<div class="shell">${appSidebar()}<div class="main-area">${header()}<main class="page-content">${tabs()}${noticeBar()}${state.view==='workspace'?workspace():state.view==='recipe'?recipe():state.view==='runner'?runner():state.view==='build'?buildView():historyView()}<div class="footer-note">DocFlow Studio · Prototype UI/UX — dữ liệu và phân trang chỉ để minh họa · Không tạo hoặc thay đổi DOCX thật.</div></main></div></div>`;document.title='DocFlow Studio — '+labels[state.view]+' (Mockup)';focusRestore(snap)}
window.app={approveSection,go,setQty,setPrice,setRate,setMode,setSingleSection,saveChangeRequest,toggleLong,updateRuleText,saveRule,changeTab,setBuildTab,tabKey,run,approveAll,createBuild,exportManifest,selectSection(i){state.selectedSection=i;render()}};
if(params.get('seed')==='ran'){state.mode='affected';run();}
if(params.get('seed')==='approved'){state.mode='affected';run();approveAll();createBuild();}
render();
